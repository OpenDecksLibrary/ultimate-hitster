name: Inspect edition sources
on:
  push:
    branches: [feature/universal-editions]
    paths: [.github/workflows/edition-sources.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          import urllib.request, re
          from urllib.parse import urljoin
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"UltimateHitster/0.3 (+https://github.com/OpenDecksLibrary/ultimate-hitster)"}),timeout=30).read().decode()
          for url in ("https://hitify.app/en/scan", "https://www.hitster4all.com/supported-hitster-editions/hitster-fr-refresh", "https://www.hitster4all.com"):
              page=get(url)
              print("PAGE",url)
              print("LINKS",re.findall(r'href="([^"]*(?:scan|play)[^"]*)"',page)[:15])
              print("IMPORTS", re.findall(r'.{0,80}import.{0,180}',page)[:15])
              scripts=set(re.findall(r'["\x27]([^"\x27\s]+\.js)["\x27]',page))
              for script in list(scripts)[:15]:
                  if "cloudflare" in script: continue
                  try:
                      js=get(urljoin(url,script))
                      matches=re.findall(r'.{0,100}(?:/api/|hitstergame|spotify|supabase|\.json).{0,180}',js,re.I)
                      if matches: print("JS",script,"MATCHES",matches[:25])
                  except Exception as error: print("ERROR",script,error)
          PY
