name: Inspect edition sources
on:
  push:
    branches: [feature/universal-editions]
    paths: [.github/workflows/edition-sources.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          import urllib.request, re
          from urllib.parse import urljoin
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"UltimateHitster/0.3 (+https://github.com/OpenDecksLibrary/ultimate-hitster)"}),timeout=30).read().decode()
          for url in ("https://hitify.app/en/scan", "https://www.hitster4all.com/supported-hitster-editions/hitster-fr-refresh"):
              try:
                  page=get(url)
                  scripts=re.findall(r'<script[^>]*src="([^"]+)"',page)
                  print("PAGE",url,"SCRIPTS",scripts)
                  print("DATA",re.findall(r'.{0,100}(?:aaaa[0-9]{4}|/api/|spotify_id|spotify_track|hitster-fr-refresh|type="module").{0,200}',page)[:40])
                  for script in scripts:
                      if "cloudflare" in script: continue
                      try:
                          js=get(urljoin(url,script))
                          matches=re.findall(r'.{0,150}(?:/api/|hitstergame|spotify|hitster/|supabase).{0,200}',js,re.I)
                          if matches: print("JS",script, "MATCHES",matches[:40])
                      except Exception as error: print("JS ERROR",script,error)
              except Exception as error: print("PAGE ERROR",url,error)
          PY
