name: Inspect edition sources
on:
  push:
    branches: [feature/universal-editions]
    paths: [.github/workflows/edition-sources.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect public catalogue markup
        run: |
          python - <<'PY'
          import urllib.request, re
          from urllib.parse import urljoin
          for url in ("https://hitify.app/en/scan", "https://www.hitster4all.com/supported-hitster-editions/hitster-fr-refresh"):
              req=urllib.request.Request(url,headers={"User-Agent":"UltimateHitster/0.3 (+https://github.com/OpenDecksLibrary/ultimate-hitster)"})
              page=urllib.request.urlopen(req, timeout=30).read().decode()
              scripts=re.findall(r'<script[^>]*src="([^"]+)"',page)
              print("PAGE",url,"SCRIPTS",scripts)
              print("DATA",re.findall(r'.{0,80}(?:aaaa[0-9]{4}|api/|spotify_id|spotify_track|hitster-fr-refresh).{0,160}',page)[:20])
              for script in scripts:
                  if "cloudflare" in script: continue
                  js=urllib.request.urlopen(urljoin(url,script),timeout=30).read().decode()
                  matches=re.findall(r'.{0,120}(?:/api/|hitstergame|spotify|hitster/|supabase).{0,200}',js,re.I)
                  if matches: print("JS",script, "MATCHES",matches[:40])
          PY
