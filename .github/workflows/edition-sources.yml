name: Inspect edition sources
on:
  push:
    branches: [feature/universal-editions]
    paths: [.github/workflows/edition-sources.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          import urllib.request, json
          def get(path):
              url="https://www.hitster4all.com/data/playlists/"+path+".json"
              return json.load(urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"UltimateHitster/0.3 (+https://github.com/OpenDecksLibrary/ultimate-hitster)"}),timeout=30))
          index=get("all")
          print("INDEX TYPE",type(index).__name__,"SAMPLE",str(index)[:2200])
          for name in ("hitster-fr-refresh", "hitster-fr"):
              data=get(name)
              print("EDITION",name,"TYPE",type(data).__name__,"SAMPLE",str(data)[:4200])
          PY
