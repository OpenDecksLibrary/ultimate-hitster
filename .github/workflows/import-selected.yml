name: Import selected catalogue editions
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Explicit import plan in configs/
        default: configs/import-v0.3.json
        required: true
        type: string
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e . -r prototype/requirements-test.txt
      - name: Import only explicitly selected editions and verify audio
        env:
          IMPORT_PLAN: ${{ inputs.plan }}
        run: python tools/import_catalogue.py --plan "$IMPORT_PLAN" --check-audio
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imported-catalogue-review
          path: data/
          retention-days: 7
# Inspect and commit the artifact on a review branch; this workflow never pushes
# canonical data or imports editions outside the selected plan.
