name: Playback prototype

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  import-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: prototype/requirements*.txt
      - run: python -m pip install -r prototype/requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python prototype/build.py
      - run: python tools/inspect_apkg.py build/playback-prototype.apkg
