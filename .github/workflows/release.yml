name: Publish prerelease

on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

concurrency:
  group: publish-prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            prototype/requirements*.txt
            pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e . -r prototype/requirements-test.txt
      - name: Read explicit publication gate
        id: plan
        run: |
          python - <<'PY'
          import json, os
          plan=json.load(open("release.json"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("publish=" + str(plan.get("publish") is True).lower() + "\n")
          PY
      - name: Test, check selected MP3s and build configured packages
        if: steps.plan.outputs.publish == 'true'
        run: python tools/prepare_release.py prepare --live
      - name: Publish assets as a prerelease
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(python -c 'from tools.prepare_release import release_plan; print(release_plan()["tag"])')
          notes=$(python -c 'from tools.prepare_release import release_plan; print(release_plan()["notes"])')
          # An existing tag/release must never be silently moved or overwritten.
          if [ -n "$(git ls-remote origin "refs/tags/$tag")" ]; then
            echo "Tag already exists: $tag. Inspect the existing release; do not overwrite it."
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Ultimate Hitster $tag" --notes-file "$notes" --prerelease --draft --latest=false
          gh release upload "$tag" dist/*.apkg dist/*.json dist/SHA256SUMS
          # Check uploaded bytes while still a draft, then make the complete release public.
          gh release download "$tag" --dir build/release-download
          python tools/prepare_release.py verify --directory build/release-download --expected dist
          gh release edit "$tag" --draft=false --prerelease --latest=false
      - name: Verify public downloads without authentication
        if: steps.plan.outputs.publish == 'true'
        run: |
          python tools/verify_release_downloads.py
